services:
  gpx-viewer:
    image: gpx-viewer:latest
    container_name: gpx-viewer
    restart: always
    networks:
      - andy-net
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.gpx-viewer.rule=HOST(`andydiary.com`) && PathPrefix(`/gpx-viewer`)'
      - 'traefik.http.services.gpx-viewer.loadbalancer.server.port=80'
      - 'traefik.http.routers.gpx-viewer.entrypoints=websecure'

networks:
  andy-net:
    external: true
